name: bounty-board-check

# 悬赏板状态机守卫（`scripts/bounty_board.py`）的 CI 门禁 —— 薄壳：只做事件分发与调用，
# 判据全在 `tests/test_bounty_board.py` 里（可本地跑、可离线跑、零第三方依赖）。
#
# 为什么需要这一份：本守卫早就写好了正反两模式，但**没进任何 workflow** ⇒
# `bounty.yml` 只跑脚本本体（`--ledger-append` / `--board-out`），`review-check.yml` 只覆盖
# 灵枢测评子站 ⇒ 本守卫实际处于「有人写了、没人跑」状态。曾经因此让两个变异体（真模式
# 审核员授权面）在 130 条断言 / 45 条变异下静默存活——**没人跑就等于没有**。
#
# 本 workflow 把「正向断言 ＋ 定点变异自证 ＋ 跑完不许把仓搞脏」钉在每次 push / PR 上。
#
# ★ 为什么**故意不加** `paths:` / `paths-ignore:`（改前请先读这段，别好心收窄）：
#   GitHub 官方文档明载：workflow 因 path filtering 被跳过时，它的 check 会**停在 Pending**，
#   而不是变成 skipped/success ⇒ 一旦本门禁被设为分支保护的必需检查，凡「改动不在过滤路径内」
#   的 PR 都会被**永久卡住**（既没跑、也不算过）。
#   出处：Skipping workflow runs / Workflow syntax（on.<push|pull_request>.paths）
#     https://docs.github.com/actions/managing-workflow-runs/skipping-workflow-runs
#     https://docs.github.com/actions/reference/workflow-syntax-for-github-actions
#   （对比：job 因 `if:` 条件被跳过 ⇒ 报 Success，不卡。要「按路径收窄」又不卡 PR，
#     正确姿势是把过滤逻辑放进 step 里判断，而不是用 workflow 级 paths。）
#   ⇒ 本仓另两个 workflow（`bounty.yml` / `review-check.yml`）也都不用 paths 过滤，与此一致。
#   本守卫全量跑一次 < 1 分钟、零依赖、不触网，漏跑一次的代价（变异体静默存活）远大于省下的配额。
#
# 安全模型（与 `bounty.yml` / `review-check.yml` 同款，改动前先读）：
#   · 本文件不引用任何仓库机密，也不写仓、不做任何提交 ⇒ `contents: read` 即够。
#   · 不用自托管 runner。
#   · 全部命令**不触网**、**零第三方依赖**（只用 Python 标准库）。
#   · 守卫内部以子进程真跑 `scripts/bounty_board.py`，但不带 `--apply` ⇒ 只读不写。
permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支上串行；不取消在跑的（留全痕）。
concurrency:
  group: bounty-board-check-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) 正向断言：退出码 0 = 全过；1 = 有失败项（逐条点名）
      - name: 状态机守卫（正向断言）
        run: python -X utf8 tests/test_bounty_board.py

      # 1b) 导出面形状守卫（元素非对象不得崩）：榜面 / 价值向量 / 授权面 / 晋升面。
      #     为什么单独一步而不并进 pytest 腿：这四件是 standalone 脚本（模块级即执行 +
      #     顶层 sys.exit）⇒ pytest 收集期会 SystemExit，整条腿 exit 3。必须逐件显式调用。
      #     （2026-10-14 维护侧补接线：原 PR #217 只带守卫、未登记进任何 workflow，
      #      等于「有人写了没人跑」——本文件头部正是为治这个毛病而存在。）
      - name: 导出面形状守卫（四件）
        run: |
          for f in tests/test_bb_score_board_element_shape.py \
                   tests/test_bb_value_vector_element_shape.py \
                   tests/test_bb_roles_from_events_shape.py \
                   tests/test_bb_promotion_report_shape.py; do
            echo "== $f"
            python -X utf8 "$f"
          done

      # 1c) 全量守卫套件：tests/test_*.py **逐件**显式调用。
      #     为什么逐件而不 pytest 整腿：多件是 standalone 脚本（模块级即执行 + 顶层 sys.exit），
      #     pytest 收集期会 SystemExit ⇒ 整条腿 exit 3，坏一件会掩盖其余全部结果。
      #     为什么需要这一步：本仓另有 30+ 件守卫（每日贡献表 / 证据链 / 三方对账 / 口径文本…），
      #     其中多件是最近才补的，**此前没有任何 workflow 会跑它们** —— 即「有人写了没人跑」。
      #     守卫只有被真的执行才算存在；不被执行的守卫会随时间静默腐朽（改了实现也不报警）。
      #     跳过关系：本步与上面 1)/1b) 有重叠（test_bounty_board 与四件 shape 也在此跑一遍），
      #     这是**故意的**：本步的职责是「凡 tests/test_*.py 皆被执行」这一不变量，
      #     不负责去重 —— 少跑一件的代价远大于重复跑一遍的时间（全套 ~25s）。
      - name: 全量守卫套件（tests/test_*.py 逐件）
        run: |
          fail=0
          n=0
          for f in tests/test_*.py; do
            n=$((n+1))
            echo "== $f"
            if ! python -X utf8 "$f"; then
              echo "::error file=$f::守卫失败：$f"
              fail=$((fail+1))
            fi
          done
          echo "共执行 $n 件守卫套件，失败 $fail 件"
          # 件数下界：防止「删掉/改名一批守卫」让本门禁静默变松（与 3b 元守卫同因）。
          if [ "$n" -lt 30 ]; then
            echo "::error::守卫套件件数从 30 降到 $n —— 是否删了/改名了守卫？"
            exit 1
          fi
          [ "$fail" -eq 0 ] || exit 1

      # 2) 定点变异自证：逐条短路一条判据 ⇒ 对应断言必须**恰好**转红
      #    （多红＝语义纠缠，少红＝判据空转；锚点命中 ≠1 ⇒ ANCHOR-MISS ＋ 退出码 2，fail-closed）
      - name: 状态机守卫 · 变异自证
        run: python -X utf8 tests/test_bounty_board.py --mutate

      # 3) 变异清单可读性（把「期望红项」逐条打出来，便于审阅本门禁到底钉了什么）
      - name: 变异清单
        run: python -X utf8 tests/test_bounty_board.py --list

      # 3b) 元守卫：变异条数**不得减少**。
      #     为什么需要它：前四步只能证明「现有变异全过」。若有人为了绕开失败而**删掉**变异
      #     （或把 --mutate 从上面的步骤里拿掉），本门禁会静默失去牙齿而依然全绿。
      #     这里把「条数」钉成下界：只许随修复增多，不许悄悄变少。
      #     （要合法减少，请在本行显式下调下界并在 PR 说明理由——让删减在 diff 里可见。）
      - name: 元守卫 · 变异条数不得减少
        run: |
          MIN_MUTATIONS=58   # 2026-10-14 上级（主干 327996c 实测 58 条；原 45/6754363 已过时）
          got=$(python -X utf8 tests/test_bounty_board.py --list | grep -c '^  M[0-9]')
          echo "变异条数实测：$got（下界 $MIN_MUTATIONS）"
          if [ "$got" -lt "$MIN_MUTATIONS" ]; then
            echo "::error::变异条数从 $MIN_MUTATIONS 降到 $got —— 门禁牙齿被削弱（是否删了变异？）"
            exit 1
          fi

      # 3c) 全量变异自证：把**所有**自己实现了 `--mutate` 的守卫逐件真跑一遍。
      #     为什么需要这一步：第 2 步只覆盖 `test_bounty_board.py` 一件，而本仓另有 10 件守卫
      #     自带 `--mutate`（正反两模式），此前**没有任何 workflow 会跑它们** —— 又是「有人写了、没人跑」。
      #     代价不是「少跑一次」，而是**反面证明会静默腐朽**：变异锚点按源码文本定位，实现一改
      #     （例如判据从串联改并联）锚点就打不中，而打不中时 harness 只会自己报 `[ANCHOR-MISS]`
      #     —— 没人跑就没人知道。实证：#383（`test_check_plan.py --mutate` 的 7 条锚点里
      #     2 条已是旧快照，主线上一跑即 rc=2，而那 2 条正是「改坏判据必须转红」的证明）。
      #     本步必须排在下面第 4 步**之前**，让「跑完不许把仓搞脏」也覆盖它（实测 ~74s、零残留）。
      #     件数下界（防批量删除）与特例表校验都在 `tests/run_mutation_guards.py` 里（fail-closed）。
      - name: 全量守卫 · 变异自证（带 --mutate 的逐件）
        run: python -X utf8 tests/run_mutation_guards.py

      # 4) 「跑完不许把仓搞脏」：上面全部跑完后，工作区必须**逐字节干净**。
      #    本守卫会真跑实现脚本（子进程），此闸用来钉住「守卫不得带写副作用」。
      - name: 跑完不许把仓搞脏
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::工作区被跑脏了——守卫或实现脚本写了仓内文件："
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
          echo "工作区干净：守卫无写副作用。"
