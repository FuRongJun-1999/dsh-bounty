<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
body { color: #f0dcae; }
.stage { padding: 46px 46px 42px; }
.frame {
  position: relative; padding: 50px 50px 42px;
  background-image: url('__ASSETS__/wood_board.png');
  background-size: cover; background-position: center;
  border: 3px solid #6b4a2c;
  outline: 2px solid var(--gold); outline-offset: -12px;
  box-shadow: 0 14px 44px rgba(0,0,0,.6), inset 0 0 120px rgba(0,0,0,.5);
}
.frame::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,190,90,.20), transparent 55%);
}
.emblem { width: 120px; height: 128px; margin: 0 auto 6px; display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
h1 { font-weight: 400; font-family: 'F-Title','S-Title',serif; font-size: 108px; text-align: center; letter-spacing: 10px; color: var(--gold-light);
     text-shadow: 0 2px 0 #000, 0 0 26px rgba(201,162,39,.4); }
.sub { text-align: center; margin-top: 18px; font-size: 36px; color: #c9ab72; letter-spacing: 5px; margin-top: 4px; }
.avatar-fallback { display: flex; align-items: center; justify-content: center;
  font-family: 'F-Title', serif; font-size: 64px; color: #2b1810;
  background: linear-gradient(160deg, #e8c96a, #c9a227 55%, #8a6d1f);
  box-shadow: 0 4px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4);
  border: 2px solid rgba(43,24,16,.55); }
.footer { margin-top: 30px; display: flex; align-items: center; justify-content: space-between; font-size: 27px; color: #a8895a; }
.seal { width: 86px; height: 90px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.6)); transform: rotate(-8deg); }
</style></head>
<body><div class="stage mat-wood">
  <div class="frame">
    <img class="emblem" src="__ASSETS__/emblem_cut.png">
    <h1 class="title-serif">冒险者档案</h1>
    <div class="sub">— CONTRIBUTION LEDGER —</div>
    <div class="divider" style="margin: 22px 0 4px"></div>
<style>
.profile { display: flex; align-items: center; gap: 24px; margin-top: 26px; padding: 26px 30px;
  background: rgba(20,10,4,.55); border: 1px solid rgba(201,162,39,.4); border-left: 6px solid var(--gold); }
.avatar { width: 110px; height: 110px; border-radius: 6px; border: 2px solid var(--gold); box-shadow: 0 3px 8px rgba(0,0,0,.5); background:#1a0f08; }
.p-name { font-size: 52px; font-weight: 900; color: var(--gold-light); text-shadow: 0 1px 3px #000; }
.p-sub { font-size: 30px; color: #b99a66; margin-top: 8px; }
.score-row { display: flex; gap: 22px; margin-top: 22px; }
.score-card { flex: 1; text-align: center; padding: 26px 12px 22px;
  background: rgba(20,10,4,.55); border: 1px solid rgba(201,162,39,.35); }
.score-card .num { font-family: 'F-Title',serif; font-size: 100px; font-weight: 900; color: var(--crimson); text-shadow: 0 2px 0 rgba(255,220,150,.25), 0 3px 6px #000; line-height: 1; }
.score-card .lbl { font-size: 28px; color: #b99a66; margin-top: 12px; letter-spacing: 2px; }
.score-card.gold .num { color: var(--gold-light); }
.section-title { margin-top: 30px; font-size: 40px; font-weight: 900; color: var(--gold-light); letter-spacing: 3px;
  display: flex; align-items: center; gap: 14px; text-shadow: 0 1px 3px #000; }
.section-title::after { content:''; flex:1; height:1px; background: linear-gradient(90deg, rgba(201,162,39,.6), transparent); }
.issues { margin-top: 16px; }
.issue { display: flex; align-items: center; gap: 16px; padding: 18px 22px; margin-top: 12px;
  background: rgba(20,10,4,.5); border-left: 5px solid var(--gold); }
.issue .ino { min-width: 96px; font-size: 34px; font-weight: 900; color: var(--gold-light); }
.issue .ibody { flex: 1; }
.issue .ititle { font-size: 34px; color: #ecd9ab; line-height: 1.4; }
.issue .imeta { font-size: 27px; color: #a8895a; margin-top: 4px; }
.issue .ipt { font-family: 'F-Title',serif; font-size: 46px; font-weight: 900; color: var(--crimson); }
.hm-wrap { margin-top: 18px; padding: 22px 20px 16px; background: rgba(20,10,4,.5); border: 1px solid rgba(201,162,39,.3); }
.hm-grid { display: grid; grid-template-columns: repeat(53, 1fr); gap: 3px; margin-top: 14px; }
.hm-cell { aspect-ratio: 1; border-radius: 2px; background: rgba(240,220,174,.08); }
.hm-cell.l1 { background: rgba(201,162,39,.35); }
.hm-cell.l2 { background: rgba(201,162,39,.62); }
.hm-cell.l3 { background: rgba(201,162,39,.88); }
.hm-cell.l4 { background: #e8c96a; box-shadow: 0 0 4px rgba(232,201,106,.7); }
.hm-cell.neg { background: rgba(139,46,46,.55); }
.hm-legend { display: flex; align-items: center; gap: 6px; font-size: 24px; color: #a8895a; margin-top: 10px; }
.hm-legend .cell { width: 14px; height: 14px; border-radius: 2px; }
.hm-note { font-size: 25px; color: #8a6f45; margin-top: 10px; }
</style>
<div id="root"></div>
<script>
/*__DATA__*/
(function(){
  var d = window.__DATA__ || {};
  var host = document.getElementById('root');
  var html = '';
  // 头像**不联网**：早期版本 <img src="https://github.com/<login>.png"> 在没有外网/
  // 该域名被墙的机器上会让整页等连接超时（实测 120s 直接渲染失败）。
  // 改为本地绘制：首字母徽记，离屏渲染零网络依赖。
  var initial = (d.github || '?').slice(0, 1).toUpperCase();
  html += '<div class="profile">' +
    '<div class="avatar avatar-fallback" aria-hidden="true">' + initial + '</div>' +
    '<div><div class="p-name"></div>' +
    '<div class="p-sub">GitHub 冒险者 · ' + (d.bound_at ? d.bound_at.slice(0,10) + ' 注册于行会' : '') + '</div></div></div>';
  html += '<div class="score-row">' +
    '<div class="score-card gold"><div class="num">' + (d.total||0) + '</div><div class="lbl">声誉总分</div></div>' +
    '<div class="score-card"><div class="num">' + (d.rank > 0 ? d.rank : '—') + '</div><div class="lbl">榜单名次 / ' + (d.people||0) + '</div></div>' +
    '<div class="score-card gold"><div class="num">' + ((d.issues||[]).length) + '</div><div class="lbl">完成委托</div></div>' +
    '</div>';
  if ((d.issues||[]).length) {
    html += '<div class="section-title">讨伐记录</div><div class="issues">';
    d.issues.forEach(function(it){
      html += '<div class="issue">' +
        '<div class="ino">' + (it.issue_no||'') + '</div>' +
        '<div class="ibody"><div class="ititle">' + (it.evidence || it.project || '——') + '</div>' +
        '<div class="imeta">' + [it.project, it.difficulty, it.impact ? '影响·'+it.impact : ''].filter(Boolean).join(' · ') + '</div></div>' +
        '<div class="ipt">' + (it.base != null ? it.base : '') + '</div></div>';
    });
    html += '</div>';
  }
  var hm = d.heatmap || {days:[], max:0};
  html += '<div class="section-title">悬赏活跃图 · 每日声誉</div>' +
    '<div class="hm-wrap"><div style="display:flex;justify-content:space-between;font-size:21px;color:#b99a66">' +
    '<span>' + (hm.start||'') + ' ~ ' + (hm.end||'') + '</span><span>区间共 ' + (hm.total||0) + ' 分</span></div>' +
    '<div class="hm-grid" id="hm"></div>' +
    '<div class="hm-legend">少 <span class="cell" style="background:rgba(240,220,174,.08)"></span>' +
    '<span class="cell" style="background:rgba(201,162,39,.35)"></span>' +
    '<span class="cell" style="background:rgba(201,162,39,.62)"></span>' +
    '<span class="cell" style="background:rgba(201,162,39,.88)"></span>' +
    '<span class="cell" style="background:#e8c96a"></span> 多</div>' +
    (hm.baseline ? '<div class="hm-note">◆ ' + hm.baseline.date + ' 为初始快照（存量 ' + hm.baseline.total + ' 分），此后逐日记增量</div>' : '') +
    '</div>';
  host.innerHTML = html;
  host.querySelector('.p-name').textContent = d.github || '未绑定';
  var grid = document.getElementById('hm');
  if (grid && hm.days) {
    hm.days.forEach(function(day){
      var c = document.createElement('div');
      var v = day.value || 0;
      var cls = 'hm-cell';
      if (v < 0) cls += ' neg';
      else if (v === 0) cls += '';
      else if (v <= 1) cls += ' l1';
      else if (v <= 3) cls += ' l2';
      else if (v <= 6) cls += ' l3';
      else cls += ' l4';
      c.className = cls;
      c.title = day.date + '  ' + (v > 0 ? '+' + v : v) + ' 分';
      grid.appendChild(c);
    });
  }
  requestAnimationFrame(function(){
    document.body.setAttribute('data-full-height', document.querySelector('.stage').scrollHeight);
  });
})();
</script>
    <div class="footer">
      <div>声誉源于交付 · 每分皆可溯源</div>
      <img class="seal" src="__ASSETS__/seal_cut.png">
    </div>
  </div>
</div></body></html>
